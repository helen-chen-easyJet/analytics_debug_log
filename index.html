<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Bug Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐞q%3C/text%3E%3C/svg%3E">


<style>
:root {
  --bg:       #fdf0f8;
  --white:    #fff8fe;
  --border:   #e8b4d8;
  --border2:  #d490c0;
  --text:     #3d1a4a;
  --muted:    #9b6aaa;
  --dim:      #c8a0d8;
  --rose:     #e8608a;
  --rose-l:   #fde8f0;
  --rose-m:   #f4b0cc;
  --lavender: #9b70e8;
  --lav-l:    #f0ebff;
  --lav-m:    #cdb8f4;
  --mint:     #50c878;
  --mint-l:   #e8fff2;
  --mint-m:   #a8e8c0;
  --peach:    #f4904a;
  --peach-l:  #fff0e8;
  --peach-m:  #f8c8a0;
  --sky:      #70b8f0;
  --sky-l:    #e8f4ff;
  --sky-m:    #b0d8f8;
  --butter:   #f8e060;
  --butter-l: #fffde8;
  --butter-m: #f8f0a0;
  --pixel:    'Press Start 2P', monospace;
  --sans:     'DM Sans', sans-serif;
  --r:        0px;
  --shadow:   4px 4px 0px #d490c0;
  --shadow-sm:2px 2px 0px #d490c0;
  --shadow-md:6px 6px 0px #c870b0;
}

@font-face {
  font-family: 'Press Start 2P';
  font-display: swap;
}

*{box-sizing:border-box;margin:0;padding:0;}

/* pixel grid bg */
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(232,180,216,.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,180,216,.18) 1px, transparent 1px);
  background-size:16px 16px;
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  image-rendering:pixelated;
}

/* ── Header ── */
header{
  background:var(--white);
  border-bottom:3px solid var(--border2);
  box-shadow:0 3px 0 var(--rose-m);
  padding:0 1.75rem;
  display:flex;align-items:center;justify-content:space-between;
  height:56px;position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:12px;}
.logo-bug{font-size:20px;line-height:1;image-rendering:pixelated;}
.logo-text{font-family:var(--pixel);font-size:9px;color:var(--text);letter-spacing:.05em;line-height:1.6;}
.logo-text span{color:var(--rose);}
.header-right{display:flex;align-items:center;gap:8px;}

/* connected pill */
.conn-pill{display:none;align-items:center;gap:5px;font-family:var(--pixel);font-size:7px;color:var(--mint);background:var(--mint-l);border:2px solid var(--mint-m);padding:4px 10px;image-rendering:pixelated;}
.conn-pill .dot{width:6px;height:6px;background:var(--mint);image-rendering:pixelated;}
.conn-pill.visible{display:flex;}

/* ── Pixel Buttons ── */
button{
  font-family:var(--sans);font-size:12px;font-weight:600;
  cursor:pointer;border:2px solid var(--border2);
  background:var(--white);color:var(--text);
  padding:6px 14px;display:inline-flex;align-items:center;gap:5px;
  transition:transform .08s,box-shadow .08s;
  line-height:1.4;
  box-shadow:var(--shadow-sm);
  border-radius:0;
  image-rendering:pixelated;
}
button:hover{background:var(--lav-l);border-color:var(--lavender);color:var(--lavender);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--lav-m);}
button:active{transform:translate(2px,2px);box-shadow:none;}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm);}
.btn-primary{background:var(--rose);border-color:#c04070;color:#fff;box-shadow:3px 3px 0 #c04070;}
.btn-primary:hover{background:#d04878;border-color:#a03060;color:#fff;box-shadow:4px 4px 0 #a03060;}
.btn-sm{padding:3px 10px;font-size:11px;}

/* ── Layout ── */
.container{max-width:860px;margin:0 auto;padding:1.5rem 1.75rem;}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:.85rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:180px;position:relative;}
.search-wrap input{
  width:100%;background:var(--white);
  border:2px solid var(--border2);
  color:var(--text);font-family:var(--sans);font-size:13px;
  padding:7px 14px 7px 34px;outline:none;
  box-shadow:var(--shadow-sm);border-radius:0;
  transition:border-color .1s;
}
.search-wrap input:focus{border-color:var(--lavender);box-shadow:3px 3px 0 var(--lav-m);}
.search-wrap input::placeholder{color:var(--dim);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;pointer-events:none;}
select{
  background:var(--white);border:2px solid var(--border2);
  color:var(--text);font-family:var(--sans);font-size:13px;
  padding:7px 12px;outline:none;cursor:pointer;
  box-shadow:var(--shadow-sm);border-radius:0;
}
select:focus{border-color:var(--lavender);}

/* ── Cards ── */
.board{display:flex;flex-direction:column;gap:12px;}

.card{
  background:var(--white);
  border:2px solid var(--border2);
  box-shadow:var(--shadow);
  transition:transform .08s,box-shadow .08s;
  overflow:visible;
  position:relative;
}
.card:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-md);}

.card-main{display:grid;grid-template-columns:8px 1fr auto auto;align-items:center;cursor:pointer;}

.card-stripe{align-self:stretch;width:8px;}
.stripe-open    {background:repeating-linear-gradient(45deg,var(--rose),var(--rose) 3px,var(--rose-m) 3px,var(--rose-m) 6px);}
.stripe-wip     {background:repeating-linear-gradient(45deg,var(--peach),var(--peach) 3px,var(--peach-m) 3px,var(--peach-m) 6px);}
.stripe-resolved{background:repeating-linear-gradient(45deg,var(--mint),var(--mint) 3px,var(--mint-m) 3px,var(--mint-m) 6px);}
.stripe-blocked {background:repeating-linear-gradient(45deg,var(--lavender),var(--lavender) 3px,var(--lav-m) 3px,var(--lav-m) 6px);}

.card-body{padding:.85rem 1rem;}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
.card-id{font-family:var(--pixel);font-size:7px;color:var(--dim);background:var(--bg);border:2px solid var(--border);padding:2px 6px;}
.card-title{font-size:14px;font-weight:600;color:var(--text);}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card-meta-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px;}

.card-right{padding:.85rem .5rem .85rem 0;display:flex;align-items:center;gap:6px;}
.card-toggle{padding:.85rem .85rem .85rem 0;color:var(--dim);font-family:var(--pixel);font-size:8px;user-select:none;}

/* ── Status pills — pixel style ── */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--pixel);font-size:7px;
  padding:4px 8px;white-space:nowrap;
  border:2px solid transparent;
  image-rendering:pixelated;
}
.pill::before{content:'■';font-size:7px;flex-shrink:0;}
.p-open    {background:var(--rose-l);   color:var(--rose);      border-color:var(--rose-m);}
.p-wip     {background:var(--peach-l);  color:var(--peach);     border-color:var(--peach-m);}
.p-resolved{background:var(--mint-l);   color:var(--mint);      border-color:var(--mint-m);}
.p-blocked {background:var(--lav-l);    color:var(--lavender);  border-color:var(--lav-m);}
.p-env     {background:var(--sky-l);    color:var(--sky);       border-color:var(--sky-m);font-family:var(--sans);font-size:11px;font-weight:600;}
.p-env::before{display:none;}

/* ── Expanded detail ── */
.card-detail{
  display:none;
  border-top:2px solid var(--border);
  padding:1rem 1rem 1rem 1.25rem;
  flex-direction:column;gap:1rem;
  background:var(--bg);
  background-image:
    linear-gradient(rgba(232,180,216,.15) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,180,216,.15) 1px,transparent 1px);
  background-size:8px 8px;
}
.card-detail.open{display:flex;}

.detail-label{font-family:var(--pixel);font-size:7px;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;}

/* status/env selector */
.status-row{display:flex;gap:6px;flex-wrap:wrap;}
.status-opt{
  font-family:var(--sans);font-size:12px;font-weight:600;
  padding:4px 12px;cursor:pointer;
  border:2px solid var(--border2);
  background:var(--white);color:var(--muted);
  transition:transform .08s,box-shadow .08s;
  box-shadow:2px 2px 0 var(--border2);
  border-radius:0;
}
.status-opt:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--lav-m);border-color:var(--lavender);color:var(--lavender);background:var(--lav-l);}
.status-opt:active{transform:translate(1px,1px);box-shadow:none;}
.status-opt.sel-open    {background:var(--rose-l);  color:var(--rose);     border-color:var(--rose-m);    box-shadow:2px 2px 0 var(--rose-m);}
.status-opt.sel-wip     {background:var(--peach-l); color:var(--peach);    border-color:var(--peach-m);   box-shadow:2px 2px 0 var(--peach-m);}
.status-opt.sel-resolved{background:var(--mint-l);  color:var(--mint);     border-color:var(--mint-m);    box-shadow:2px 2px 0 var(--mint-m);}
.status-opt.sel-blocked {background:var(--lav-l);   color:var(--lavender); border-color:var(--lav-m);     box-shadow:2px 2px 0 var(--lav-m);}

/* title edit */
.title-edit-input{
  font-size:14px;font-weight:600;color:var(--text);
  border:2px solid var(--lavender);padding:2px 8px;
  outline:none;font-family:var(--sans);
  background:var(--white);box-shadow:3px 3px 0 var(--lav-m);
  border-radius:0;
}

/* ── Note thread ── */
.note-thread{display:flex;flex-direction:column;gap:8px;}
.note-entry{background:var(--white);border:2px solid var(--border);padding:.6rem .85rem;box-shadow:2px 2px 0 var(--border);}
.note-meta{font-family:var(--pixel);font-size:7px;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.note-text{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;}
.note-del{font-family:var(--pixel);font-size:7px;color:var(--dim);cursor:pointer;padding:2px 6px;border:2px solid transparent;background:none;box-shadow:none;border-radius:0;}
.note-del:hover{color:var(--rose);border-color:var(--rose-m);background:var(--rose-l);transform:none;box-shadow:none;}

.note-add{display:flex;flex-direction:column;gap:7px;}
.note-add textarea{
  width:100%;background:var(--white);
  border:2px solid var(--border2);
  color:var(--text);font-family:var(--sans);font-size:13px;
  padding:8px 12px;outline:none;resize:vertical;min-height:64px;line-height:1.55;
  border-radius:0;box-shadow:2px 2px 0 var(--border);
}
.note-add textarea:focus{border-color:var(--lavender);box-shadow:3px 3px 0 var(--lav-m);}
.note-add-row{display:flex;gap:7px;align-items:center;}
.note-add-row input{
  flex:1;background:var(--white);border:2px solid var(--border2);
  color:var(--text);font-family:var(--sans);font-size:12px;
  padding:5px 12px;outline:none;border-radius:0;box-shadow:2px 2px 0 var(--border);
}
.note-add-row input:focus{border-color:var(--lavender);box-shadow:3px 3px 0 var(--lav-m);}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(61,26,74,.4);z-index:300;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--white);
  border:3px solid var(--border2);
  box-shadow:var(--shadow-md);
  animation:fadeUp .15s ease;
  overflow:hidden;width:440px;max-height:92vh;overflow-y:auto;
  border-radius:0;
}
@keyframes fadeUp{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{
  padding:1rem 1.25rem;border-bottom:2px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--rose-l);z-index:1;
}
.modal-header h3{font-family:var(--pixel);font-size:9px;color:var(--text);display:flex;align-items:center;gap:7px;line-height:1.8;}
.modal-body{padding:1.25rem;display:flex;flex-direction:column;gap:.85rem;}
.modal-footer{padding:.9rem 1.25rem;border-top:2px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--lav-l);}
.modal-footer .spacer{flex:1;}
.close-btn{background:none;border:2px solid transparent;color:var(--muted);font-size:16px;padding:4px 8px;cursor:pointer;line-height:1;box-shadow:none;border-radius:0;}
.close-btn:hover{background:var(--rose-l);color:var(--rose);border-color:var(--rose-m);transform:none;box-shadow:none;}

/* form fields */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-family:var(--pixel);font-size:7px;color:var(--muted);letter-spacing:.05em;line-height:2;}
.field input,.field select,.field textarea{
  background:var(--bg);border:2px solid var(--border2);
  color:var(--text);font-family:var(--sans);font-size:13px;
  padding:8px 12px;outline:none;width:100%;
  box-shadow:2px 2px 0 var(--border);border-radius:0;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lavender);box-shadow:3px 3px 0 var(--lav-m);background:var(--white);}
.field textarea{resize:vertical;min-height:72px;line-height:1.55;}

.env-opt{
  font-family:var(--sans);font-size:12px;font-weight:600;
  padding:4px 12px;cursor:pointer;
  border:2px solid var(--border);background:var(--white);color:var(--muted);
  transition:transform .08s,box-shadow .08s;
  box-shadow:2px 2px 0 var(--border);border-radius:0;
}
.env-opt:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--sky-m);border-color:var(--sky);color:var(--sky);background:var(--sky-l);}
.env-opt:active{transform:translate(1px,1px);box-shadow:none;}
.env-opt.sel-env{background:var(--sky-l);color:var(--sky);border-color:var(--sky-m);box-shadow:2px 2px 0 var(--sky-m);}

/* ── Flag ── */
.flag-btn{background:none;border:none;font-size:15px;cursor:pointer;padding:2px 6px;box-shadow:none;line-height:1;opacity:.25;transition:opacity .15s,transform .1s;border-radius:0;}
.flag-btn:hover{opacity:.7;transform:scale(1.2);background:none;}
.flag-btn.flagged{opacity:1;}

/* ── Sort bar ── */
.sort-bar{display:flex;align-items:center;gap:6px;margin-bottom:.85rem;}
.sort-bar span{font-family:var(--pixel);font-size:7px;color:var(--dim);letter-spacing:.05em;}
.sort-btn{font-family:var(--sans);font-size:11px;font-weight:600;padding:4px 12px;border:2px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;transition:transform .08s,box-shadow .08s;box-shadow:2px 2px 0 var(--border);border-radius:0;}
.sort-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--lav-m);border-color:var(--lavender);color:var(--lavender);background:var(--lav-l);}
.sort-btn.active{background:var(--lav-l);color:var(--lavender);border-color:var(--lavender);box-shadow:2px 2px 0 var(--lav-m);font-weight:700;}

/* ── States ── */
.state-msg{text-align:center;padding:4rem 2rem;color:var(--dim);font-family:var(--pixel);font-size:8px;line-height:2.5;}
.spinner{display:inline-block;width:12px;height:12px;border:3px solid var(--border2);border-top-color:var(--rose);animation:spin .7s steps(8) infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none!important;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border:1px solid var(--border);}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-bug">🌸</span>
    <span class="logo-text">bug<span>board</span></span>
  </div>
  <div class="header-right">
    <div class="conn-pill" id="connPill"><span class="dot"></span>Connected</div>
    <button id="connectBtn" class="btn-primary">⇄ Connect Sheet</button>
    <button id="newBugBtn" class="btn-primary hidden">＋ New bug</button>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search bugs…">
    </div>
    <select id="fStatus">
      <option value="">All statuses</option>
      <option>Open</option>
      <option>In Progress</option>
      <option>Resolved</option>
      <option>Blocked</option>
    </select>
    <select id="fEnv">
      <option value="">All environments</option>
      <option>Prod</option>
      <option>PreProd</option>
      <option>development</option>
    </select>
  </div>

  <div class="sort-bar">
    <span>Sort</span>
    <button class="sort-btn active" data-sort="date-desc">Newest first</button>
    <button class="sort-btn" data-sort="date-asc">Oldest first</button>
    <button class="sort-btn" data-sort="flagged">🚩 Flagged first</button>
  </div>

  <div class="board" id="board">
    <div class="state-msg">connect your sheet to load bugs ♡</div>
  </div>
</div>

<!-- New bug modal -->
<div class="modal-overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>🌸 new bug</h3>
      <button class="close-btn" id="closeForm">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>What's the bug?</label>
        <textarea id="f-bug" placeholder="Describe what's broken…"></textarea>
      </div>
      <div class="field">
        <label>Environment</label>
        <select id="f-env">
          <option value="">Select…</option>
          <option>Prod</option>
          <option>PreProd2</option>
          <option>PreProd3</option>
        </select>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="modal-footer">
      <div class="spacer"></div>
      <button id="cancelForm">Cancel</button>
      <button class="btn-primary" id="submitForm">Add bug</button>
    </div>
  </div>
</div>

<script>
// ── HARDCODED — not shown in UI ─────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwB2xriADIGI_7P_QLfecoVTdZdaYYgkQZlrSaamEAIQNp_-hb3oEmx4TkI8zeuRHfeCQ/exec';
// ────────────────────────────────────────────────────────────

let allLogs    = [];
let expandedId = null;
let sortMode   = 'date-desc';

const SK = s => ({Open:'open','In Progress':'wip',Resolved:'resolved',Blocked:'blocked'}[s]||'open');

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function parseNotes(raw) {
  if (!raw) return [];
  return raw.split('\n---\n').map(s=>s.trim()).filter(Boolean).map(s=>{
    const nl = s.indexOf('\n');
    return nl === -1 ? { meta:'', text:s } : { meta:s.slice(0,nl), text:s.slice(nl+1) };
  });
}
function serializeNotes(notes) {
  return notes.map(n=>`${n.meta}\n${n.text}`).join('\n---\n');
}

// ── Connect & fetch ────────────────────────────────────────
async function connect() {
  const btn = document.getElementById('connectBtn');
  btn.disabled = true; btn.textContent = 'Connecting…';
  await fetchLogs();
}

async function fetchLogs() {
  const btn = document.getElementById('connectBtn');
  document.getElementById('board').innerHTML = `<div class="state-msg"><span class="spinner"></span>Loading…</div>`;
  try {
    const res  = await fetch(`${SCRIPT_URL}?action=getLogs`);
    const data = await res.json();
    allLogs = data.logs || [];
    document.getElementById('connPill').classList.add('visible');
    document.getElementById('newBugBtn').classList.remove('hidden');
    btn.textContent = '↻ Refresh'; btn.disabled = false;
    btn.onclick = fetchLogs;
    render();
  } catch(e) {
    document.getElementById('board').innerHTML = `<div class="state-msg" style="color:var(--red)">Couldn't reach the sheet — check your Apps Script URL.</div>`;
    btn.textContent = '⇄ Connect Sheet'; btn.disabled = false;
  }
}

async function patchField(id, field, value) {
  await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'updateField', id, field, value }) });
  const l = allLogs.find(x => x['ID'] === id);
  if (l) l[field] = value;
}

// ── Render ─────────────────────────────────────────────────
function filtered() {
  const q  = document.getElementById('searchInput').value.toLowerCase();
  const st = document.getElementById('fStatus').value;
  const en = document.getElementById('fEnv').value;
  let logs = allLogs.filter(l => {
    const txt = [l['ID'], l['Bug']].join(' ').toLowerCase();
    return (!q || txt.includes(q))
      && (!st || l['Status'] === st)
      && (!en || l['Environment'] === en);
  });
  if (sortMode === 'date-desc') logs.sort((a,b) => (b['Date']||'').localeCompare(a['Date']||''));
  if (sortMode === 'date-asc')  logs.sort((a,b) => (a['Date']||'').localeCompare(b['Date']||''));
  if (sortMode === 'name-asc')  logs.sort((a,b) => (a['Bug']||'').localeCompare(b['Bug']||''));
  if (sortMode === 'name-desc') logs.sort((a,b) => (b['Bug']||'').localeCompare(a['Bug']||''));
  if (sortMode === 'flagged')   logs.sort((a,b) => (b['Flagged']==='true'?1:0) - (a['Flagged']==='true'?1:0));
  return logs;
}

function render() {
  const board = document.getElementById('board');
  const logs  = filtered();
  if (!logs.length) { board.innerHTML = `<div class="state-msg">no bugs found ✨ you did it!</div>`; return; }

  board.innerHTML = logs.map(l => {
    const sk     = SK(l['Status']);
    const isOpen = expandedId === l['ID'];
    const notes  = parseNotes(l['Notes']);

    return `
    <div class="card" data-id="${l['ID']}">
      <div class="card-main" data-toggle="${l['ID']}">
        <div class="card-stripe stripe-${sk}"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="card-id">${l['ID']}</span>
            <span id="title-wrap-${l['ID']}">
              <span class="card-title" id="title-display-${l['ID']}">${l['Bug']||'—'}</span>
              <button class="btn-sm" data-title-open="${l['ID']}" style="font-size:10px;padding:1px 8px;margin-left:4px;border-radius:99px">✎ edit</button>
            </span>
          </div>
          <div class="card-meta">
            ${l['Environment'] ? `<span class="card-meta-item"><span class="pill p-env">${l['Environment']}</span></span>` : ''}
            ${l['Date'] ? `<span class="card-meta-item" style="font-size:11px;color:var(--dim)">${fmtDate(l['Date'])}</span>` : ''}
            <span class="card-meta-item" style="font-size:11px;color:var(--dim)">${notes.length} note${notes.length!==1?'s':''}</span>
          </div>
        </div>
        <div class="card-right" style="gap:6px">
          <button class="flag-btn${l['Flagged']==='true'?' flagged':''}" data-flag="${l['ID']}" title="Flag this bug">🚩</button>
          <span class="pill p-${sk}">${l['Status']||'Open'}</span>
        </div>
        <div class="card-toggle">${isOpen?'▲':'▼'}</div>
      </div>

      <div class="card-detail ${isOpen?'open':''}">

        <div>
          <div class="detail-label">Status</div>
          <div class="status-row">
            ${['Open','In Progress','Resolved','Blocked'].map(s=>`
              <button class="status-opt${l['Status']===s?' sel-'+SK(s):''}" data-id="${l['ID']}" data-status="${s}">${s}</button>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="detail-label">Environment</div>
          <div class="status-row">
            ${['Prod','PreProd','development'].map(env=>`
              <button class="env-opt${l['Environment']===env?' sel-env':''}" data-id="${l['ID']}" data-env="${env}">${env}</button>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="detail-label">Notes (${notes.length})</div>
          <div class="note-thread" id="notes-thread-${l['ID']}">
            ${notes.length ? notes.map((n,i)=>`
              <div class="note-entry">
                <div class="note-meta">
                  <span>${n.meta}</span>
                  <button class="note-del" data-note-delete="${l['ID']}" data-note-index="${i}">✕ delete</button>
                </div>
                <div class="note-text">${n.text}</div>
              </div>`).join('')
            : `<p style="font-size:13px;color:var(--dim);padding:.25rem 0">No notes yet.</p>`}
          </div>
          <div class="note-add" style="margin-top:8px">
            <textarea id="note-input-${l['ID']}" placeholder="What did you try? What did you find?"></textarea>
            <div class="note-add-row">
              <input type="text" id="note-author-${l['ID']}" placeholder="Your name">
              <button class="btn-primary btn-sm" data-note-add="${l['ID']}">＋ Add note</button>
            </div>
          </div>
        </div>

      </div>
    </div>`;
  }).join('');

  // flag
  board.querySelectorAll('[data-flag]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id  = btn.dataset.flag;
      const log = allLogs.find(x=>x['ID']===id);
      if (!log) return;
      const next = log['Flagged'] === 'true' ? 'false' : 'true';
      btn.classList.toggle('flagged', next==='true');
      await patchField(id, 'Flagged', next);
      if (sortMode==='flagged') render();
    });
  });

  // toggle
  board.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.status-opt,[data-note-add],[data-note-delete],[data-title-open],.note-add,input,textarea')) return;
      const id = el.dataset.toggle;
      expandedId = expandedId === id ? null : id;
      render();
    });
  });

  // status
  board.querySelectorAll('.status-opt').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await patchField(btn.dataset.id, 'Status', btn.dataset.status);
      render();
    });
  });

  // environment
  board.querySelectorAll('.env-opt').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await patchField(btn.dataset.id, 'Environment', btn.dataset.env);
      render();
    });
  });

  // title open
  board.querySelectorAll('[data-title-open]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id  = btn.dataset.titleOpen;
      const cur = document.getElementById(`title-display-${id}`).textContent;
      const wrap = document.getElementById(`title-wrap-${id}`);
      wrap.innerHTML = `
        <input class="title-edit-input" id="title-input-${id}" value="${cur.replace(/"/g,'&quot;')}">
        <button class="btn-primary btn-sm" data-title-save="${id}" style="margin-left:5px">Save</button>
        <button class="btn-sm" data-title-cancel="${id}" style="margin-left:4px">Cancel</button>`;
      const inp = document.getElementById(`title-input-${id}`);
      inp.focus(); inp.select();
      wrap.querySelector(`[data-title-save]`).addEventListener('click', async e2 => {
        e2.stopPropagation();
        const val = inp.value.trim();
        if (!val) return;
        await patchField(id, 'Bug', val);
        render();
      });
      wrap.querySelector(`[data-title-cancel]`).addEventListener('click', e2 => {
        e2.stopPropagation(); render();
      });
      inp.addEventListener('keydown', async e2 => {
        if (e2.key==='Enter') { e2.preventDefault(); wrap.querySelector(`[data-title-save]`).click(); }
        if (e2.key==='Escape') { e2.stopPropagation(); render(); }
      });
    });
  });

  // note delete
  board.querySelectorAll('[data-note-delete]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id    = btn.dataset.noteDelete;
      const index = parseInt(btn.dataset.noteIndex);
      const log   = allLogs.find(x=>x['ID']===id);
      if (!log) return;
      const notes = parseNotes(log['Notes']);
      notes.splice(index, 1);
      btn.textContent = '…'; btn.disabled = true;
      await patchField(id, 'Notes', serializeNotes(notes));
      render();
    });
  });

  // note add
  board.querySelectorAll('[data-note-add]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id     = btn.dataset.noteAdd;
      const text   = document.getElementById(`note-input-${id}`).value.trim();
      const author = document.getElementById(`note-author-${id}`).value.trim() || 'Anonymous';
      if (!text) return;
      const now  = new Date();
      const meta = `${now.toLocaleDateString('en-GB')} ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${author}`;
      const log  = allLogs.find(x=>x['ID']===id);
      const raw  = log ? (log['Notes']||'') : '';
      const updated = raw ? `${raw}\n---\n${meta}\n${text}` : `${meta}\n${text}`;
      btn.textContent = 'Saving…'; btn.disabled = true;
      await patchField(id, 'Notes', updated);
      render();
    });
  });
}

// ── Form ───────────────────────────────────────────────────
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

async function handleSubmit() {
  const log = {
    bug:         document.getElementById('f-bug').value.trim(),
    environment: document.getElementById('f-env').value,
    date:        document.getElementById('f-date').value,
  };
  if (!log.bug) return;
  const btn = document.getElementById('submitForm');
  btn.textContent = 'Saving…'; btn.disabled = true;
  await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'addLog', log }) });
  await fetchLogs();
  btn.textContent = 'Add bug'; btn.disabled = false;
  closeForm();
}

function openForm() {
  document.getElementById('f-bug').value = '';
  document.getElementById('f-env').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('formOverlay').classList.add('open');
}
function closeForm() { document.getElementById('formOverlay').classList.remove('open'); }

// ── Events ─────────────────────────────────────────────────
document.getElementById('connectBtn').addEventListener('click', connect);
document.getElementById('newBugBtn').addEventListener('click', openForm);
document.getElementById('closeForm').addEventListener('click', closeForm);
document.getElementById('cancelForm').addEventListener('click', closeForm);
document.getElementById('submitForm').addEventListener('click', handleSubmit);
['searchInput','fStatus','fEnv'].forEach(id =>
  document.getElementById(id).addEventListener('input', render)
);

document.querySelectorAll('[data-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort;
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('active', b===btn));
    render();
  });
});
</script>
</body>
</html>
