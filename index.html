<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐞q%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg:       #faf8ff;
  --white:    #ffffff;
  --border:   #ece8ff;
  --border2:  #d8d0ff;
  --text:     #1a1535;
  --muted:    #7c6f9f;
  --dim:      #b0a8cc;
  --purple:   #6c47ff;
  --purple-l: #f0ecff;
  --purple-m: #c9bbff;
  --pink:     #f0488a;
  --pink-l:   #fff0f6;
  --pink-m:   #ffb8d6;
  --green:    #00a86b;
  --green-l:  #edfff7;
  --green-m:  #9eecd1;
  --amber:    #f59e0b;
  --amber-l:  #fffbeb;
  --amber-m:  #fde68a;
  --red:      #f0384f;
  --red-l:    #fff0f2;
  --red-m:    #ffb8c2;
  --blue:     #0ea5e9;
  --blue-l:   #f0faff;
  --blue-m:   #bae6fd;
  --sans:     'DM Sans', sans-serif;
  --mono:     'DM Mono', monospace;
  --r:        10px;
  --rl:       14px;
  --shadow:   0 1px 4px rgba(108,71,255,.08), 0 1px 2px rgba(108,71,255,.04);
  --shadow-md:0 4px 20px rgba(108,71,255,.12), 0 2px 6px rgba(108,71,255,.06);
}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;}

/* ── Header ── */
header{background:var(--white);border-bottom:1.5px solid var(--border);padding:0 1.75rem;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-bug{font-size:22px;line-height:1;}
.logo-text{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.02em;}
.logo-text span{color:var(--purple);}
.header-right{display:flex;align-items:center;gap:8px;}

/* connected pill */
.conn-pill{display:none;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--green);background:var(--green-l);border:1.5px solid var(--green-m);border-radius:99px;padding:3px 11px;}
.conn-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.conn-pill.visible{display:flex;}

/* ── Buttons ── */
button{font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border-radius:99px;border:1.5px solid var(--border2);background:var(--white);color:var(--text);padding:6px 16px;display:inline-flex;align-items:center;gap:5px;transition:all .15s;line-height:1.4;box-shadow:var(--shadow);}
button:hover{background:var(--purple-l);border-color:var(--purple-m);color:var(--purple);}
button:active{transform:scale(.97);}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(108,71,255,.3);}
.btn-primary:hover{background:#5535ee;border-color:#5535ee;color:#fff;}
.btn-sm{padding:3px 11px;font-size:12px;border-radius:99px;}

/* ── Layout ── */
.container{max-width:860px;margin:0 auto;padding:1.5rem 1.75rem;}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1.1rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:180px;position:relative;}
.search-wrap input{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:99px;color:var(--text);font-family:var(--sans);font-size:13px;padding:6px 14px 6px 36px;outline:none;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow);}
.search-wrap input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.12);}
.search-wrap input::placeholder{color:var(--dim);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;pointer-events:none;}
select{background:var(--white);border:1.5px solid var(--border);border-radius:99px;color:var(--text);font-family:var(--sans);font-size:13px;padding:6px 14px;outline:none;cursor:pointer;box-shadow:var(--shadow);}
select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.12);}

/* ── Cards ── */
.board{display:flex;flex-direction:column;gap:10px;}

.card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .15s,border-color .15s;}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--purple-m);}

.card-main{display:grid;grid-template-columns:5px 1fr auto auto;align-items:center;cursor:pointer;}

.card-stripe{align-self:stretch;width:5px;border-radius:var(--rl) 0 0 var(--rl);}
.stripe-open    {background:linear-gradient(180deg,var(--red),var(--pink));}
.stripe-wip     {background:linear-gradient(180deg,var(--amber),#f59e0b);}
.stripe-resolved{background:linear-gradient(180deg,var(--green),#00c47e);}
.stripe-blocked {background:linear-gradient(180deg,#a855f7,#7c3aed);}

.card-body{padding:.85rem 1rem;}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.card-id{font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:1px 7px;}
.card-title{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.01em;}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card-meta-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px;}
.card-meta-item strong{color:var(--text);font-weight:500;}

.card-right{padding:.85rem .5rem .85rem 0;display:flex;align-items:center;}
.card-toggle{padding:.85rem .85rem .85rem 0;color:var(--dim);font-size:11px;user-select:none;}

/* ── Status pills ── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1.5px solid transparent;letter-spacing:.01em;}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.p-open    {background:var(--red-l);   color:var(--red);   border-color:var(--red-m);}   .p-open::before{background:var(--red);}
.p-wip     {background:var(--amber-l); color:var(--amber); border-color:var(--amber-m);} .p-wip::before{background:var(--amber);}
.p-resolved{background:var(--green-l); color:var(--green); border-color:var(--green-m);} .p-resolved::before{background:var(--green);}
.p-blocked {background:var(--purple-l);color:var(--purple);border-color:var(--purple-m);}.p-blocked::before{background:var(--purple);}
.p-env     {background:var(--blue-l);  color:var(--blue);  border-color:var(--blue-m);font-weight:500;}
.p-env::before{display:none;}

/* ── Expanded detail ── */
.card-detail{display:none;border-top:1.5px solid var(--border);padding:1rem 1rem 1rem 1.25rem;flex-direction:column;gap:1rem;background:var(--bg);}
.card-detail.open{display:flex;}

.detail-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:6px;}

/* status selector */
.status-row{display:flex;gap:6px;flex-wrap:wrap;}
.status-opt{font-size:12px;font-weight:500;padding:4px 12px;border-radius:99px;cursor:pointer;border:1.5px solid var(--border2);background:var(--white);color:var(--muted);transition:all .12s;}
.status-opt:hover{border-color:var(--purple-m);color:var(--purple);background:var(--purple-l);}
.status-opt.sel-open    {background:var(--red-l);   color:var(--red);   border-color:var(--red-m);}
.status-opt.sel-wip     {background:var(--amber-l); color:var(--amber); border-color:var(--amber-m);}
.status-opt.sel-resolved{background:var(--green-l); color:var(--green); border-color:var(--green-m);}
.status-opt.sel-blocked {background:var(--purple-l);color:var(--purple);border-color:var(--purple-m);}

/* title edit */
.title-edit-input{font-size:14px;font-weight:600;color:var(--text);border:1.5px solid var(--purple);border-radius:8px;padding:2px 8px;outline:none;font-family:var(--sans);background:var(--white);box-shadow:0 0 0 3px rgba(108,71,255,.12);}

/* ── Note thread ── */
.note-thread{display:flex;flex-direction:column;gap:7px;}
.note-entry{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:.6rem .85rem;}
.note-meta{font-size:10px;font-family:var(--mono);color:var(--dim);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;}
.note-text{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;}
.note-del{font-size:10px;color:var(--dim);cursor:pointer;padding:1px 6px;border-radius:99px;border:1px solid transparent;background:none;box-shadow:none;}
.note-del:hover{color:var(--red);border-color:var(--red-m);background:var(--red-l);}

.note-add{display:flex;flex-direction:column;gap:7px;}
.note-add textarea{width:100%;background:var(--white);border:1.5px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;resize:vertical;min-height:64px;line-height:1.55;transition:border-color .15s,box-shadow .15s;}
.note-add textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.12);}
.note-add-row{display:flex;gap:7px;align-items:center;}
.note-add-row input{flex:1;background:var(--white);border:1.5px solid var(--border2);border-radius:99px;color:var(--text);font-family:var(--sans);font-size:12px;padding:5px 12px;outline:none;transition:border-color .15s;}
.note-add-row input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.12);}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,21,53,.35);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border:1.5px solid var(--border);border-radius:18px;box-shadow:var(--shadow-md);animation:fadeUp .18s ease;overflow:hidden;width:440px;max-height:92vh;overflow-y:auto;}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{padding:1.1rem 1.25rem;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--white);z-index:1;}
.modal-header h3{font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;}
.modal-body{padding:1.25rem;display:flex;flex-direction:column;gap:.85rem;}
.modal-footer{padding:.9rem 1.25rem;border-top:1.5px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg);}
.modal-footer .spacer{flex:1;}
.close-btn{background:none;border:none;color:var(--muted);font-size:16px;padding:4px 8px;cursor:pointer;line-height:1;border-radius:8px;box-shadow:none;}
.close-btn:hover{background:var(--purple-l);color:var(--purple);}

/* form fields */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em;}
.field input,.field select,.field textarea{background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.12);background:var(--white);}
.field textarea{resize:vertical;min-height:72px;line-height:1.55;}

/* ── States ── */
.state-msg{text-align:center;padding:4rem 2rem;color:var(--dim);font-size:13px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none!important;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-bug">🐛</span>
    <span class="logo-text">Bug<span>board</span></span>
  </div>
  <div class="header-right">
    <div class="conn-pill" id="connPill"><span class="dot"></span>Connected</div>
    <button id="connectBtn" class="btn-primary">⇄ Connect Sheet</button>
    <button id="newBugBtn" class="btn-primary hidden">＋ New bug</button>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search bugs…">
    </div>
    <select id="fStatus">
      <option value="">All statuses</option>
      <option>Open</option>
      <option>In Progress</option>
      <option>Resolved</option>
      <option>Blocked</option>
    </select>
    <select id="fEnv">
      <option value="">All environments</option>
      <option>Prod</option>
      <option>PreProd2</option>
      <option>PreProd3</option>
      <option>fCore</option>
      <option>other</option>
    </select>
  </div>

  <div class="board" id="board">
    <div class="state-msg">Connect your sheet to load bugs.</div>
  </div>
</div>

<!-- New bug modal -->
<div class="modal-overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>🐛 New bug</h3>
      <button class="close-btn" id="closeForm">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>What's the bug?</label>
        <textarea id="f-bug" placeholder="Describe what's broken…"></textarea>
      </div>
      <div class="field">
        <label>Environment</label>
        <select id="f-env">
          <option value="">Select…</option>
          <option>Prod</option>
          <option>PreProd2</option>
          <option>PreProd3</option>
          <option>fCore</option>
          <option>other</option>
        </select>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="modal-footer">
      <div class="spacer"></div>
      <button id="cancelForm">Cancel</button>
      <button class="btn-primary" id="submitForm">Add bug</button>
    </div>
  </div>
</div>

<script>
// ── HARDCODED — not shown in UI ─────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwB2xriADIGI_7P_QLfecoVTdZdaYYgkQZlrSaamEAIQNp_-hb3oEmx4TkI8zeuRHfeCQ/exec';
// ────────────────────────────────────────────────────────────

let allLogs    = [];
let expandedId = null;

const SK = s => ({Open:'open','In Progress':'wip',Resolved:'resolved',Blocked:'blocked'}[s]||'open');

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function parseNotes(raw) {
  if (!raw) return [];
  return raw.split('\n---\n').map(s=>s.trim()).filter(Boolean).map(s=>{
    const nl = s.indexOf('\n');
    return nl === -1 ? { meta:'', text:s } : { meta:s.slice(0,nl), text:s.slice(nl+1) };
  });
}
function serializeNotes(notes) {
  return notes.map(n=>`${n.meta}\n${n.text}`).join('\n---\n');
}

// ── Connect & fetch ────────────────────────────────────────
async function connect() {
  const btn = document.getElementById('connectBtn');
  btn.disabled = true; btn.textContent = 'Connecting…';
  await fetchLogs();
}

async function fetchLogs() {
  const btn = document.getElementById('connectBtn');
  document.getElementById('board').innerHTML = `<div class="state-msg"><span class="spinner"></span>Loading…</div>`;
  try {
    const res  = await fetch(`${SCRIPT_URL}?action=getLogs`);
    const data = await res.json();
    allLogs = data.logs || [];
    document.getElementById('connPill').classList.add('visible');
    document.getElementById('newBugBtn').classList.remove('hidden');
    btn.textContent = '↻ Refresh'; btn.disabled = false;
    btn.onclick = fetchLogs;
    render();
  } catch(e) {
    document.getElementById('board').innerHTML = `<div class="state-msg" style="color:var(--red)">Couldn't reach the sheet — check your Apps Script URL.</div>`;
    btn.textContent = '⇄ Connect Sheet'; btn.disabled = false;
  }
}

async function patchField(id, field, value) {
  await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'updateField', id, field, value }) });
  const l = allLogs.find(x => x['ID'] === id);
  if (l) l[field] = value;
}

// ── Render ─────────────────────────────────────────────────
function filtered() {
  const q  = document.getElementById('searchInput').value.toLowerCase();
  const st = document.getElementById('fStatus').value;
  const en = document.getElementById('fEnv').value;
  return allLogs.filter(l => {
    const txt = [l['ID'], l['Bug']].join(' ').toLowerCase();
    return (!q || txt.includes(q))
      && (!st || l['Status'] === st)
      && (!en || l['Environment'] === en);
  });
}

function render() {
  const board = document.getElementById('board');
  const logs  = filtered();
  if (!logs.length) { board.innerHTML = `<div class="state-msg">No bugs found 🎉</div>`; return; }

  board.innerHTML = logs.map(l => {
    const sk     = SK(l['Status']);
    const isOpen = expandedId === l['ID'];
    const notes  = parseNotes(l['Notes']);

    return `
    <div class="card" data-id="${l['ID']}">
      <div class="card-main" data-toggle="${l['ID']}">
        <div class="card-stripe stripe-${sk}"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="card-id">${l['ID']}</span>
            <span id="title-wrap-${l['ID']}">
              <span class="card-title" id="title-display-${l['ID']}">${l['Bug']||'—'}</span>
              <button class="btn-sm" data-title-open="${l['ID']}" style="font-size:10px;padding:1px 8px;margin-left:4px;border-radius:99px">✎ edit</button>
            </span>
          </div>
          <div class="card-meta">
            ${l['Environment'] ? `<span class="card-meta-item"><span class="pill p-env">${l['Environment']}</span></span>` : ''}
            ${l['Date'] ? `<span class="card-meta-item" style="font-size:11px;color:var(--dim)">${fmtDate(l['Date'])}</span>` : ''}
            <span class="card-meta-item" style="font-size:11px;color:var(--dim)">${notes.length} note${notes.length!==1?'s':''}</span>
          </div>
        </div>
        <div class="card-right">
          <span class="pill p-${sk}">${l['Status']||'Open'}</span>
        </div>
        <div class="card-toggle">${isOpen?'▲':'▼'}</div>
      </div>

      <div class="card-detail ${isOpen?'open':''}">

        <div>
          <div class="detail-label">Status</div>
          <div class="status-row">
            ${['Open','In Progress','Resolved','Blocked'].map(s=>`
              <button class="status-opt${l['Status']===s?' sel-'+SK(s):''}" data-id="${l['ID']}" data-status="${s}">${s}</button>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="detail-label">Notes (${notes.length})</div>
          <div class="note-thread" id="notes-thread-${l['ID']}">
            ${notes.length ? notes.map((n,i)=>`
              <div class="note-entry">
                <div class="note-meta">
                  <span>${n.meta}</span>
                  <button class="note-del" data-note-delete="${l['ID']}" data-note-index="${i}">✕ delete</button>
                </div>
                <div class="note-text">${n.text}</div>
              </div>`).join('')
            : `<p style="font-size:13px;color:var(--dim);padding:.25rem 0">No notes yet.</p>`}
          </div>
          <div class="note-add" style="margin-top:8px">
            <textarea id="note-input-${l['ID']}" placeholder="What did you try? What did you find?"></textarea>
            <div class="note-add-row">
              <input type="text" id="note-author-${l['ID']}" placeholder="Your name">
              <button class="btn-primary btn-sm" data-note-add="${l['ID']}">＋ Add note</button>
            </div>
          </div>
        </div>

      </div>
    </div>`;
  }).join('');

  // toggle
  board.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.status-opt,[data-note-add],[data-note-delete],[data-title-open],.note-add,input,textarea')) return;
      const id = el.dataset.toggle;
      expandedId = expandedId === id ? null : id;
      render();
    });
  });

  // status
  board.querySelectorAll('.status-opt').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await patchField(btn.dataset.id, 'Status', btn.dataset.status);
      render();
    });
  });

  // title open
  board.querySelectorAll('[data-title-open]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id  = btn.dataset.titleOpen;
      const cur = document.getElementById(`title-display-${id}`).textContent;
      const wrap = document.getElementById(`title-wrap-${id}`);
      wrap.innerHTML = `
        <input class="title-edit-input" id="title-input-${id}" value="${cur.replace(/"/g,'&quot;')}">
        <button class="btn-primary btn-sm" data-title-save="${id}" style="margin-left:5px">Save</button>
        <button class="btn-sm" data-title-cancel="${id}" style="margin-left:4px">Cancel</button>`;
      const inp = document.getElementById(`title-input-${id}`);
      inp.focus(); inp.select();
      wrap.querySelector(`[data-title-save]`).addEventListener('click', async e2 => {
        e2.stopPropagation();
        const val = inp.value.trim();
        if (!val) return;
        await patchField(id, 'Bug', val);
        render();
      });
      wrap.querySelector(`[data-title-cancel]`).addEventListener('click', e2 => {
        e2.stopPropagation(); render();
      });
      inp.addEventListener('keydown', async e2 => {
        if (e2.key==='Enter') { e2.preventDefault(); wrap.querySelector(`[data-title-save]`).click(); }
        if (e2.key==='Escape') { e2.stopPropagation(); render(); }
      });
    });
  });

  // note delete
  board.querySelectorAll('[data-note-delete]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id    = btn.dataset.noteDelete;
      const index = parseInt(btn.dataset.noteIndex);
      const log   = allLogs.find(x=>x['ID']===id);
      if (!log) return;
      const notes = parseNotes(log['Notes']);
      notes.splice(index, 1);
      btn.textContent = '…'; btn.disabled = true;
      await patchField(id, 'Notes', serializeNotes(notes));
      render();
    });
  });

  // note add
  board.querySelectorAll('[data-note-add]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id     = btn.dataset.noteAdd;
      const text   = document.getElementById(`note-input-${id}`).value.trim();
      const author = document.getElementById(`note-author-${id}`).value.trim() || 'Anonymous';
      if (!text) return;
      const now  = new Date();
      const meta = `${now.toLocaleDateString('en-GB')} ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${author}`;
      const log  = allLogs.find(x=>x['ID']===id);
      const raw  = log ? (log['Notes']||'') : '';
      const updated = raw ? `${raw}\n---\n${meta}\n${text}` : `${meta}\n${text}`;
      btn.textContent = 'Saving…'; btn.disabled = true;
      await patchField(id, 'Notes', updated);
      render();
    });
  });
}

// ── Form ───────────────────────────────────────────────────
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

async function handleSubmit() {
  const log = {
    bug:         document.getElementById('f-bug').value.trim(),
    environment: document.getElementById('f-env').value,
    date:        document.getElementById('f-date').value,
  };
  if (!log.bug) return;
  const btn = document.getElementById('submitForm');
  btn.textContent = 'Saving…'; btn.disabled = true;
  await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'addLog', log }) });
  await fetchLogs();
  btn.textContent = 'Add bug'; btn.disabled = false;
  closeForm();
}

function openForm() {
  document.getElementById('f-bug').value = '';
  document.getElementById('f-env').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('formOverlay').classList.add('open');
}
function closeForm() { document.getElementById('formOverlay').classList.remove('open'); }

// ── Events ─────────────────────────────────────────────────
document.getElementById('connectBtn').addEventListener('click', connect);
document.getElementById('newBugBtn').addEventListener('click', openForm);
document.getElementById('closeForm').addEventListener('click', closeForm);
document.getElementById('cancelForm').addEventListener('click', closeForm);
document.getElementById('submitForm').addEventListener('click', handleSubmit);
['searchInput','fStatus','fEnv'].forEach(id =>
  document.getElementById(id).addEventListener('input', render)
);
</script>
